<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메뉴바 팝오버</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shared.css">
</head>
<body>
<x-dc>
<helmet>
<style>
  body{ margin:0; }
</style>
</helmet>
<div class="theme-root {{themeCls}}" style="width:320px; height:420px; display:flex; flex-direction:column; align-items:flex-end; padding-top:26px; background:var(--bg-sunken);">

  <div style="width:100%; height:24px; background:var(--menubar); display:flex; align-items:center; justify-content:flex-end; padding:0 10px; gap:10px; flex:0 0 24px;">
    <div style="width:14px; height:14px; opacity:.45; display:flex; align-items:center; justify-content:center; color:var(--text);">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18M6 11a6 6 0 0112 0M9 18h6"/></svg>
    </div>
    <div style="width:16px; height:16px; border-radius:4px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:var(--on-accent);">
      <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>
    </div>
  </div>

  <div style="width:300px; margin:6px 10px 0 0; background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:14px; display:flex; flex-direction:column; gap:12px;">

    <div style="display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:13px; font-weight:700;">CamZoom</span>
      <label class="switch">
        <input type="checkbox" checked>
        <span class="track"></span>
        <span class="thumb"></span>
      </label>
    </div>

    <div class="camera-feed" style="width:100%; aspect-ratio:16/9; border-radius:8px;">
      <div class="silhouette"></div>
      <span style="position:absolute; left:8px; bottom:6px; font-size:10px; color:rgba(255,255,255,.75); font-weight:600;">현재 출력</span>
    </div>

    <div style="display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span class="panel-label">확대</span>
        <span style="font-size:12px; color:var(--text-secondary); font-variant-numeric:tabular-nums;">1.8배</span>
      </div>
      <input type="range" min="1" max="5" step="0.1" value="1.8" aria-label="확대 배율">
    </div>

    <div style="display:flex; flex-direction:column; gap:6px;">
      <span class="panel-label">프리셋</span>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="chip" type="button">기본</button>
        <button class="chip active" type="button">눈코 확대</button>
        <button class="chip" type="button">정사각형</button>
      </div>
    </div>

    <div style="height:1px; background:var(--border);"></div>

    <div style="display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:13px;">효과</span>
      <label class="switch">
        <input type="checkbox" checked>
        <span class="track"></span>
        <span class="thumb"></span>
      </label>
    </div>

    <div style="height:1px; background:var(--border);"></div>

    <button class="btn" type="button" style="width:100%; text-align:center; font-weight:600;">메인 창 열기 →</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":320,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeCls: "theme-" + (this.props.theme ?? "light") };
  }
}
</script>
</body>
</html>
