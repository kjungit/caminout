<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shared.css">
</head>
<body>
<x-dc>
<helmet>
<style>
  body{ margin:0; }
  .settings-section{ display:flex; flex-direction:column; gap:14px; padding:18px 0; border-bottom:1px solid var(--border); }
  .settings-section:last-of-type{ border-bottom:none; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .settings-row .label{ font-size:13px; }
  .settings-row .desc{ font-size:12px; color:var(--text-tertiary); margin-top:2px; }
</style>
</helmet>
<div class="theme-root {{themeCls}}" style="width:640px; height:600px; padding:30px; background:var(--bg-sunken);">
<div class="mac-window">

  <div class="titlebar">
    <div class="traffic"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
    <span class="titlebar-title">설정</span>
  </div>

  <div style="flex:1; padding:22px 28px; display:flex; flex-direction:column; overflow:auto;">

    <div class="settings-section">
      <span class="panel-label">카메라</span>
      <label class="field">
        입력 카메라
        <select>
          <option>FaceTime HD 카메라</option>
          <option>아이폰 (연속성 카메라)</option>
          <option>외장 USB 웹캠</option>
        </select>
      </label>
      <label class="field">
        출력 해상도
        <select>
          <option>1920 × 1080</option>
          <option>1280 × 720</option>
          <option>1080 × 1080 (정사각형)</option>
        </select>
      </label>
    </div>

    <div class="settings-section">
      <span class="panel-label">단축키</span>
      <div class="settings-row">
        <span class="label">효과 켜기 / 끄기</span>
        <input type="text" value="⌘⇧E" readonly style="width:90px; text-align:center;" aria-label="효과 켜기 끄기 단축키">
      </div>
      <div class="settings-row">
        <span class="label">드라마틱 줌</span>
        <input type="text" value="⌘⇧Z" readonly style="width:90px; text-align:center;" aria-label="드라마틱 줌 단축키">
      </div>
      <div class="settings-row">
        <span class="label">화면 얼리기</span>
        <input type="text" value="⌘⇧F" readonly style="width:90px; text-align:center;" aria-label="화면 얼리기 단축키">
      </div>
    </div>

    <div class="settings-section">
      <span class="panel-label">일반</span>
      <div class="settings-row">
        <div>
          <div class="label">화면 모드</div>
          <div class="desc">시스템을 고르면 맥 설정을 따라가요</div>
        </div>
        <div style="display:flex; gap:6px;">
          <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
            <button class="chip {{m.cls}}" type="button" onClick="{{m.pick}}">{{m.label}}</button>
          </sc-for>
        </div>
      </div>
      <div class="settings-row">
        <div>
          <div class="label">로그인 시 자동 실행</div>
          <div class="desc">통화 중 가상 카메라가 끊기지 않도록 미리 켜 둬요</div>
        </div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="track"></span>
          <span class="thumb"></span>
        </label>
      </div>
      <div class="settings-row">
        <div>
          <div class="label">메뉴바 아이콘만 표시</div>
          <div class="desc">Dock에는 아이콘을 보이지 않아요</div>
        </div>
        <label class="switch">
          <input type="checkbox">
          <span class="track"></span>
          <span class="thumb"></span>
        </label>
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; margin-top:auto; padding-top:16px;">
      <button class="btn primary" type="button">완료</button>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":640,"height":600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: "system" };
  }
  renderVals() {
    const theme = this.props.theme ?? "light";
    const mode = this.state.mode ?? "system";
    return {
      themeCls: "theme-" + theme,
      modes: [["system", "시스템"], ["light", "라이트"], ["dark", "다크"]].map(([k, label]) => ({
        label,
        cls: mode === k ? "active" : "",
        pick: () => this.setState({ mode: k })
      }))
    };
  }
}
</script>
</body>
</html>
