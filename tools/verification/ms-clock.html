<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밀리초 시계</title>
<style>
  /* 전체 지연 측정용 (검증 계획 4장 B1).
     이 화면을 띄우고 카메라로 비춘 뒤, 화상 앱 미리보기 속 시계와 이 시계를
     한 장의 스크린샷에 담아 차이를 잰다. 20회 반복해 중앙값을 쓴다. */
  :root { --bg: #ffffff; --fg: #111111; --muted: #666666; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111111; --fg: #f5f5f5; --muted: #999999; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
         font-family: ui-monospace, Menlo, monospace; }
  #clock { font-size: clamp(48px, 14vw, 200px); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  #hint { color: var(--muted); font-size: 14px; padding: 0 16px; text-align: center; }
</style>
</head>
<body>
  <div id="clock">00:00.000</div>
  <div id="hint">화상 앱 미리보기와 이 화면을 함께 스크린샷으로 찍어 두 시각의 차이를 기록하세요.</div>
<script>
  const el = document.getElementById('clock');
  function tick() {
    const now = new Date();
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    const ms = String(now.getMilliseconds()).padStart(3, '0');
    el.textContent = `${m}:${s}.${ms}`;
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
