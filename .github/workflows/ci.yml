# PR·main: 패키지 단위 테스트 + 서명 없는 앱·익스텐션 빌드 (기술 설계서 10장).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package tests
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [CamZoomCore, CamZoomShared, EffectsKit, CaptureKit, CameraBridge]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  app:
    name: App build (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project CamZoom.xcodeproj \
            -scheme CamZoom \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
